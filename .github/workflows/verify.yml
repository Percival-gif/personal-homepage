name: Verify personal homepage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-verification
          path: |
            qa/screens/
            qa/lighthouse/
            test-results/
            playwright-report/
